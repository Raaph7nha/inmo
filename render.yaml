# Configuración de despliegue para Render (https://render.com)
# Puedes desplegarlo como Web Service (Node.js) o como Static Site.

services:
  # Opción 1: Web Service en Node.js (con Express y soporte de rutas amigables)
  - type: web
    name: habitabogota
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production

  # Opción 2: Sitio Estático (100% gratuito, sin servidor Node)
  # Si prefieres solo estático en Render, usa:
  # - type: static
  #   name: habitabogota-static
  #   buildCommand: npm run build
  #   staticPublishPath: ./dist
